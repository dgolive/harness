service:
  name: k8s_harnessservice
  identifier: k8s_harnessservice
  orgIdentifier: default
  projectIdentifier: harnesstest1
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: java-app-1-k8s
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: hngcharness
                  gitFetchType: Branch
                  repoName: gh-my-harness
                  branch: main
                  paths:
                    - jenkins/java-app-1/k8s/deployment.yaml
                    - jenkins/java-app-1/k8s/service.yaml
              skipResourceVersioning: false
              enableDeclarativeRollback: false
  gitOpsEnabled: false
