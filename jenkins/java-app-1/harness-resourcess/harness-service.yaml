service:
  name: hn-svc-java-app-1
  identifier: java-app-1
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: java-app-1
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: harnessgitconnector
                  gitFetchType: Branch
                  paths:
                    - java-app-1/java-app-1-deployment.yaml
                    - java-app-1/java-app-1-svc.yaml
                  repoName: gh-my-harness
                  branch: master
                skipResourceVersioning: false
                enableDeclarativeRollback: false
  gitOpsEnabled: false
